<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Wall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a floating library panel on the left (screen count, folder tree), the player wall on the right (transport bar + CSS grid of screens). On phones the panel becomes an overlay. */
:root{
  --bg:#e8ebed; --panel:#f6f7f8; --panel-2:#eceff1; --line:#cdd4d9; --fg:#12181c; --muted:#59656c;
  --accent:#0b7c82; --accent-fg:#ffffff; --accent-soft:#d3ebec;
  --screen:#080a0c; --screen-fg:#e7eef0; --screen-muted:#8c9aa1;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1114; --panel:#151a1e; --panel-2:#1c2227; --line:#2a323a; --fg:#e5ebee; --muted:#8e9aa2;
    --accent:#45c2c6; --accent-fg:#04201f; --accent-soft:#143538;
    --screen:#030405; --screen-fg:#e7eef0; --screen-muted:#8c9aa1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1114; --panel:#151a1e; --panel-2:#1c2227; --line:#2a323a; --fg:#e5ebee; --muted:#8e9aa2;
  --accent:#45c2c6; --accent-fg:#04201f; --accent-soft:#143538;
  --screen:#030405; --screen-fg:#e7eef0; --screen-muted:#8c9aa1;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:14px; line-height:1.4;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; overflow:hidden;
}
button,select,input{font:inherit;color:inherit}
h1,h2,p{margin:0}

.shell{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:304px minmax(0,1fr);gap:12px;position:relative}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--panel-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn.icon{width:34px;padding:0}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.mono{font-family:var(--font-mono);font-size:12px}
button:focus-visible,select:focus-visible,input:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none}
.mobile-only{display:none}

/* ---------- left panel ---------- */
.nav{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 14px 12px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1.1}
.brand p{margin-top:4px;font-size:12px;color:var(--muted)}
.sec{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.sec.lib{flex:1;min-height:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-head h2{font:500 11px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.readout{font:500 12px var(--font-mono);font-variant-numeric:tabular-nums}

.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.preset{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 7px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;cursor:pointer;color:var(--muted)}
.preset:hover{border-color:var(--muted)}
.preset[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.glyph{display:grid;gap:2px;width:34px;height:22px}
.glyph i{display:block;background:currentColor;opacity:.5;border-radius:1.5px}
.preset[aria-pressed="true"] .glyph i{background:var(--accent);opacity:1}
.preset b{font:500 12px var(--font-mono)}

.steppers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stepper{display:flex;align-items:center;gap:6px;min-width:0}
.stepper label{font-size:12px;color:var(--muted);flex:1}
.stepper .btn{width:30px;height:30px;font-size:16px;line-height:1}
.stepper output{min-width:1.2em;text-align:center;font:500 13px var(--font-mono);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}

.lib-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--muted);min-height:1em}
.note.codec{font:400 11px var(--font-mono)}
.brand h1 small{font:500 11px var(--font-mono);color:var(--muted);margin-left:8px;letter-spacing:.04em;vertical-align:middle}
.tree-wrap{flex:1;min-height:90px;overflow:auto;margin:0 -6px;padding:2px 6px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:2px;min-height:30px;border-radius:6px;padding-right:6px}
.row:hover{background:var(--panel-2)}
.row.sel{background:var(--accent-soft)}
.chev{flex:none;width:22px;height:26px;display:grid;place-items:center;background:none;border:0;border-radius:5px;cursor:pointer;color:var(--muted)}
.chev .ic{transition:transform .12s}
.chev[aria-expanded="true"] .ic{transform:rotate(90deg)}
.name{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:4px 6px;background:none;border:0;border-radius:6px;cursor:pointer;text-align:left}
.name .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.sel .name .ic{color:var(--accent)}
.name .ic{color:var(--muted)}
.vid{cursor:grab}
.vid .t{font-size:13px}
.count{font:400 11px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent)}

.folder-bar{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:9px}
.fb-row{display:flex;align-items:center;gap:8px;min-width:0}
.fb-row .lbl{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fb-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.range{flex:1;text-align:center;font:500 12px var(--font-mono);font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.folder-bar .btn.icon{width:32px;height:32px}

/* ---------- effects tab ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.tab{height:38px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.sec.fxp{flex:1;min-height:0;overflow:auto;gap:12px}
.sec.fxp > *{flex-shrink:0}
.field.wide{display:flex;width:100%}
.field.wide select{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{height:32px;border:0;background:var(--panel);cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.params{display:flex;flex-direction:column;gap:10px}
.prm{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.prm label{font-size:12.5px;color:var(--muted)}
.prm output{font:500 12px var(--font-mono);font-variant-numeric:tabular-nums}
.prm input[type="range"]{grid-column:1/-1;width:100%;margin:0;accent-color:var(--accent)}
.prm select{grid-column:1/-1;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0 6px}
.beatbox{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.beatdot{--beat:0;width:12px;height:12px;border-radius:50%;background:var(--accent);opacity:calc(.35 + var(--beat) * .65);transform:scale(calc(1 + var(--beat) * .9))}
.fxcv{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;background:var(--screen)}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;background:var(--bg)}
.stage:fullscreen{padding:12px}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scrub-wrap{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:10px}
.scrub{flex:1;min-width:80px;accent-color:var(--accent);height:24px}
.time{font:400 12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.field{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 4px 0 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.field span{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field select{border:0;background:transparent;height:30px;font-size:13px;cursor:pointer;color:var(--fg)}

.grid{flex:1;min-height:0;display:grid;gap:8px}
.grid.zoomed{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important}
.grid.zoomed .cell:not(.is-zoom){display:none}
.cell{position:relative;min-width:0;min-height:0;background:var(--screen);color:var(--screen-fg);border-radius:8px;overflow:hidden}
.cell::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;box-shadow:inset 0 0 0 2px transparent}
.cell.active::after{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.drop::after{box-shadow:inset 0 0 0 3px var(--accent)}
.cell video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--screen);display:none}
.cell.filled video{display:block}
.grid[data-fit="cover"] .cell video{object-fit:cover}
.empty{position:absolute;inset:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center;color:var(--screen-muted);font-size:12px;border:1px dashed rgba(140,154,161,.35);border-radius:6px}
.empty b{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--screen-fg)}
.cell.filled .empty{display:none}
.err{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;background:var(--screen);color:var(--screen-fg);font-size:12px}
.bar{position:absolute;left:0;right:0;z-index:2;display:flex;align-items:center;gap:6px;padding:8px}
.bar.top{top:0;padding-bottom:20px;background:linear-gradient(rgba(0,0,0,.65),transparent);pointer-events:none}
.bar.bottom{bottom:0;justify-content:flex-end;flex-wrap:wrap;padding-top:20px;background:linear-gradient(transparent,rgba(0,0,0,.72));opacity:0;transition:opacity .15s}
.cell:not(.filled) .bar{display:none}
.cell:hover .bar.bottom,.cell:focus-within .bar.bottom{opacity:1}
@media (hover:none){.bar.bottom{opacity:1}}
.idx{flex:none;font:500 11px var(--font-mono);background:rgba(255,255,255,.16);padding:2px 6px;border-radius:4px}
.title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cbtn{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:6px;background:rgba(255,255,255,.16);color:var(--screen-fg);cursor:pointer}
.cbtn:hover{background:rgba(255,255,255,.3)}
.csel{height:30px;min-width:0;max-width:120px;border:0;border-radius:6px;background:rgba(255,255,255,.16);color:var(--screen-fg);font-size:12px;padding:0 6px;cursor:pointer}
.csel option{background:#1b2126;color:#e7eef0}
@keyframes huespin{to{filter:hue-rotate(360deg)}}
.fx-spin{animation:huespin 8s linear infinite}

/* ---------- phones ---------- */
@media (max-width:800px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:absolute;inset:0;z-index:20;display:none}
  .shell.nav-open .nav{display:flex}
  .mobile-only{display:inline-flex}
  .grid{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.fx-spin{animation:none!important}}
</style>

</head>
<body>
<div class="shell" id="shell">
  <aside class="nav" id="nav" aria-label="Screens and library">
    <div class="brand">
      <div>
        <h1>Video Wall<small>v8</small></h1>
        <p>Plays from your disk. Nothing is uploaded.</p>
      </div>
      <button class="btn mobile-only" id="navDone" type="button">Done</button>
    </div>

    <section class="sec" aria-labelledby="screensH">
      <div class="sec-head"><h2 id="screensH">Screens</h2><span class="readout" id="readout"></span></div>
      <div class="presets" id="presets" role="group" aria-label="Screen layout presets"></div>
      <div class="steppers">
        <div class="stepper">
          <label for="colVal">Columns</label>
          <button class="btn" id="colMinus" type="button" aria-label="Fewer columns">−</button>
          <output id="colVal"></output>
          <button class="btn" id="colPlus" type="button" aria-label="More columns">+</button>
        </div>
        <div class="stepper">
          <label for="rowVal">Rows</label>
          <button class="btn" id="rowMinus" type="button" aria-label="Fewer rows">−</button>
          <output id="rowVal"></output>
          <button class="btn" id="rowPlus" type="button" aria-label="More rows">+</button>
        </div>
      </div>
      <p class="hint" id="perfHint" hidden>Many screens at once can slow playback, especially with HD files.</p>
    </section>

    <div class="tabs" role="group" aria-label="Library or effects">
      <button class="tab" id="tabLib" type="button" aria-selected="true">Library</button>
      <button class="tab" id="tabFx" type="button" aria-selected="false">Effects</button>
    </div>

    <section class="sec lib" aria-labelledby="libH">
      <div class="sec-head"><h2 id="libH">Library</h2></div>
      <div class="lib-actions">
        <button class="btn" id="openFolder" type="button"><span data-icon="folder"></span>Open folder</button>
        <button class="btn" id="addVideos" type="button"><span data-icon="film"></span>Add videos</button>
      </div>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
      <input type="file" id="filesInput" accept="video/*,.mkv,.mov,.m4v,.avi" multiple hidden>
      <p class="note" id="libNote" aria-live="polite"></p>
      <p class="note codec" id="codecNote"></p>
      <div class="tree-wrap" id="treeWrap"><ul class="tree" id="tree"></ul></div>
      <div class="folder-bar" id="folderBar"></div>
    </section>

    <section class="sec fxp" id="fxSec" aria-labelledby="fxH" hidden>
      <div class="sec-head"><h2 id="fxH">Effects</h2><span class="readout" id="fxTarget"></span></div>
      <label class="field wide"><span>Effect</span>
        <select id="fxSel" aria-label="Effect">
          <option value="none">None</option>
          <option value="mirror">Mirror Symmetry</option>
          <option value="portals">Orbital Viewports</option>
          <option value="slice">Strip Displacement</option>
        </select>
      </label>
      <div class="seg" role="group" aria-label="Apply effect to">
        <button type="button" data-target="active" aria-pressed="true">Outlined screen</button>
        <button type="button" data-target="all" aria-pressed="false">All screens</button>
      </div>
      <div class="chips" id="fxPresets"></div>
      <div class="params" id="fxParams"></div>
      <div class="beatbox">
        <div class="sec-head"><h2>Beat</h2><span class="beatdot" id="beatDot" aria-hidden="true"></span></div>
        <label class="field wide"><span>Source</span>
          <select id="beatMode" aria-label="Beat source">
            <option value="audio">Music (auto-detect)</option>
            <option value="tempo">Tempo clock</option>
          </select>
        </label>
        <div class="prm"><label for="bpm">Tempo</label><output id="bpmOut">118</output><input id="bpm" type="range" min="60" max="200" value="118"></div>
        <div class="prm"><label for="beatSens">Music sensitivity</label><output id="sensOut">6</output><input id="beatSens" type="range" min="1" max="10" value="6"></div>
        <button class="btn" id="tapTempo" type="button">Tap tempo</button>
        <p class="hint" id="beatStatus"></p>
      </div>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="transport">
      <div class="group">
        <button class="btn mobile-only" id="navOpen" type="button"><span data-icon="folder"></span>Library</button>
        <button class="btn primary" id="playAll" type="button"></button>
        <button class="btn mono" id="back10" type="button" aria-label="Back 10 seconds">−10s</button>
        <button class="btn mono" id="fwd10" type="button" aria-label="Forward 10 seconds">+10s</button>
        <button class="btn icon" id="restart" type="button" aria-label="Restart all" title="Restart all"><span data-icon="restart"></span></button>
        <button class="btn" id="shuffleBtn" type="button" title="Put a random video on every screen (S)"><span data-icon="shuffle"></span>Shuffle</button>
        <button class="btn" id="autoBtn" type="button" aria-pressed="false" title="When a video ends, play a random one on that screen"><span data-icon="shuffle"></span>Auto-shuffle</button>
      </div>
      <div class="scrub-wrap">
        <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek all videos together">
        <span class="time" id="time">—</span>
      </div>
      <div class="group">
        <label class="field"><span>Filter</span><select id="filterAll" aria-label="Filter for all screens"></select></label>
        <button class="btn" id="mixFilters" type="button" title="Give every screen a random filter"><span data-icon="sparkle"></span>Mix</button>
        <label class="field"><span>Speed</span>
          <select id="speed">
            <option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option>
            <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
          </select>
        </label>
        <label class="field"><span>Fit</span>
          <select id="fit"><option value="contain" selected>Whole</option><option value="cover">Fill</option></select>
        </label>
        <button class="btn icon" id="muteAll" type="button"></button>
        <button class="btn icon" id="loopAll" type="button" aria-pressed="false" aria-label="Loop all" title="Loop all"><span data-icon="loop"></span></button>
        <button class="btn icon" id="fsBtn" type="button" aria-label="Fullscreen" title="Fullscreen"><span data-icon="fullscreen"></span></button>
      </div>
    </div>
    <div class="grid" id="grid" data-fit="contain"></div>
  </main>
</div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const coll = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
const byName = (a, b) => coll.compare(a.name, b.name);
const fmt = s => {
  if (!Number.isFinite(s)) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
};

const I = {
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  chevL: '<path d="M15 6l-6 6 6 6"/>',
  film: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M10 9.5l5 2.5-5 2.5z"/>',
  play: '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
  pause: '<path d="M8 5v14M16 5v14" stroke-width="3.2"/>',

const DEMOS = {

    const w = W / 7, sh = t * 70, k = Math.floor(sh / w), off = sh % w;

  },
  ball(ctx, W, H, t, name) {

  presetsEl.innerHTML = Object.keys(def.presets).map(n =>
    `<button class="chip" type="button" data-preset="${esc(n)}" aria-pressed="${fxPanel.preset === n}">${esc(n)}</button>`).join('');
  const P = fxPanel.params[id];
  paramsEl.innerHTML = def.ui.map(u => {
    const v = P[u.k], idk = 'fxp_' + u.k;
    if (u.t === 'rng') return `<div class="prm"><label for="${idk}">${esc(u.l)}</label><output id="${idk}_o">${esc(fmtVal(v, u))}</output><input id="${idk}" type="range" data-k="${u.k}" min="${u.min}" max="${u.max}" step="${u.step || 1}" value="${v}"></div>`;
    if (u.t === 'sel') return `<div class="prm"><label for="${idk}">${esc(u.l)}</label><select id="${idk}" data-k="${u.k}">${u.o.map(([val, lab]) => `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select></div>`;
    return `<label class="check"><input type="checkbox" id="${idk}" data-k="${u.k}"${v ? ' checked' : ''}><span>${esc(u.l)}</span></label>`;
  }).join('');
}

/* ---------- wiring ---------- */
const fxSec = $('#fxSec'), libSec = document.querySelector('.sec.lib');
function showTab(which) {
  const fx = which === 'fx';
  $('#tabLib').setAttribute('aria-selected', String(!fx));
  $('#tabFx').setAttribute('aria-selected', String(fx));
  libSec.hidden = fx; fxSec.hidden = !fx;
}
$('#tabLib').onclick = () => showTab('lib');
$('#tabFx').onclick = () => { showTab('fx'); fxLabel(); };

$('#fxSel').addEventListener('change', e => {
  fxPanel.fx = e.target.value; fxPanel.preset = '';
  beatInit(); renderFxPanel(); fxApply();
});
fxSec.addEventListener('click', e => {
  const chip = e.target.closest('.chip[data-preset]');
  if (chip) {
    const id = fxPanel.fx, name = chip.dataset.preset;
    fxPanel.params[id] = { ...FXDEF[id].presets[name] }; fxPanel.preset = name;
    beatInit(); renderFxPanel(); fxApply(); return;
  }
  const seg = e.target.closest('[data-target]');
  if (seg) {
    fxPanel.target = seg.dataset.target;
    fxSec.querySelectorAll('[data-target]').forEach(b => b.setAttribute('aria-pressed', String(b === seg)));
    fxApply();
  }
});
fxSec.addEventListener('input', e => {
  const el = e.target, k = el.dataset.k, id = fxPanel.fx;
  if (!k || !FXDEF[id]) return;
  const u = FXDEF[id].ui.find(x => x.k === k), cur = fxPanel.params[id][k];
  let val;
  if (el.type === 'checkbox') val = el.checked;
  else if (el.type === 'range') val = Number(el.value);
  else val = typeof cur === 'number' ? Number(el.value) : el.value;
  fxPanel.params[id][k] = val; fxPanel.preset = '';
  fxSec.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', 'false'));
  const out = $('#fxp_' + k + '_o'); if (out) out.textContent = fmtVal(val, u);
  beatInit(); fxApply();
});
$('#beatMode').addEventListener('change', e => { beat.mode = e.target.value; if (beat.mode === 'audio') beatInit(); beat.next = 0; });
$('#bpm').addEventListener('input', e => { beat.bpm = Number(e.target.value); $('#bpmOut').textContent = e.target.value; beat.next = 0; });
$('#beatSens').addEventListener('input', e => { $('#sensOut').textContent = e.target.value; beat.sens = 2.2 - 0.12 * Number(e.target.value); });
$('#tapTempo').addEventListener('click', tapTempo);
renderFxPanel(); fxLabel();


/* ---------- boot ---------- */
function refreshUI() {
  keepFocus(() => { renderTree(); renderFooter(); });
  renderLayoutUI(); refreshTransport(); tick();
}
rebuildTree();
['Demo clips', 'Demo clips/Motion', 'Demo clips/Test patterns'].forEach(p => expanded.add(p));
note('Demo clips are loaded so you can try the layout. Open a folder to use your own videos.');
{
  const probe = document.createElement('video');
  const can = t => probe.canPlayType(t) || 'no';
  const h264 = can('video/mp4; codecs="avc1.640028, mp4a.40.2"'), vp9 = can('video/webm; codecs="vp9, opus"');
  $('#codecNote').textContent = `This browser: H.264 + AAC ${h264}, WebM ${vp9}.` +
    (h264 === 'no' ? ' H.264 MP4 will not play here. Use a WebM file or another browser.' : '');
}
setLayout(2, 2);
selectFolder('Demo clips');
})();
</script>
